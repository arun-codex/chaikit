name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check TypeScript types (real static check)
        run: npm run typecheck

      - name: Run Unit & Component Tests
        run: npm test

      - name: Build all packages
        run: npm run build

      - name: Verify Package Packing Integrity
        run: |
          npm pack -w packages/core
          npm pack -w packages/widget
          npm pack -w packages/react

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright Browser Tests
        run: npx playwright test --project=chromium --project=firefox

      - name: Check Bundle Size Budget (< 50 KB gzipped)
        run: |
          node -e '
            const fs = require("fs");
            const zlib = require("zlib");
            const file = "packages/widget/dist/chaikit.iife.js";
            const content = fs.readFileSync(file);
            const gzipSize = zlib.gzipSync(content).length;
            console.log("IIFE Bundle Gzip Size:", gzipSize, "bytes (" + (gzipSize / 1024).toFixed(2) + " KB)");
            if (gzipSize > 50 * 1024) {
              console.error("FAIL: IIFE bundle exceeded 50KB gzip budget!");
              process.exit(1);
            }
            console.log("SUCCESS: Bundle size within budget.");
          '
