name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Tests
        run: npm test

      - name: Build Packages
        run: npm run build

      - name: Publish to npm (Provenance enabled)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish -w packages/core --provenance --access public || echo "Publishing @chaikit/core requires manual NPM_TOKEN"
          npm publish -w packages/widget --provenance --access public || echo "Publishing chaikit requires manual NPM_TOKEN"
          npm publish -w packages/react --provenance --access public || echo "Publishing @chaikit/react requires manual NPM_TOKEN"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/widget/dist/chaikit.iife.js
            packages/widget/dist/chaikit.esm.js
          generate_release_notes: true
