name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: 1. Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Unit & Component Tests
        run: npm test

  build-and-verify:
    name: 2. Build & Verify Packages
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build all packages
        run: npm run build

      - name: Verify package pack integrity
        run: |
          npm pack -w packages/core
          npm pack -w packages/widget
          npm pack -w packages/react
          tar -tf chaikit-core-*.tgz
          tar -tf chaikit-widget-*.tgz
          tar -tf chaikit-react-*.tgz

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            packages/core/dist/
            packages/widget/dist/
            packages/react/dist/

  publish-npm:
    name: 3. Publish to npm
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish @chaikit/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/core --provenance --access public

      - name: Publish @chaikit/widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/widget --provenance --access public

      - name: Publish @chaikit/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/react --provenance --access public

  github-release:
    name: 4. Create GitHub Release
    needs: [publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/widget/dist/chaikit.iife.js
            packages/widget/dist/chaikit.esm.js
          generate_release_notes: true
